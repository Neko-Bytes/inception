# Inception: 3 containers, 2 volumes, 1 network
#
#   browser --443--> nginx --9000--> wordpress (php-fpm) --3306--> mariadb
#
# What's in here:
#   services  = the 3 containers, each built from our own Dockerfile
#   volumes   = where the database and the website files are kept (/home/kmummadi/data)
#   networks  = the private network the containers use to talk to each other
#   secrets   = the password files from ../secrets/
#
# Sources:
#   startup order + healthcheck: https://docs.docker.com/compose/how-tos/startup-order/
#   secrets:                     https://docs.docker.com/compose/how-tos/use-secrets/
#   env_file:                    https://docs.docker.com/compose/how-tos/environment-variables/set-environment-variables/
#   volumes:                     https://docs.docker.com/reference/compose-file/volumes/
#   bridge network:              https://docs.docker.com/engine/network/drivers/bridge/
#   restart, container_name:     https://docs.docker.com/reference/compose-file/services/

services:

  mariadb:
    build: ./requirements/mariadb
    # image name = service name, with our own tag "inception" (never the default tag)
    image: mariadb:inception
    container_name: mariadb
    # start again after a crash or a reboot (but not after `make down`)
    restart: unless-stopped
    # the settings from .env (database name, user names...) become environment variables
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    # "healthy" = MariaDB answers. ping says yes even if it refuses the login,
    # so no password is needed here. wordpress waits for this (see depends_on below).
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    restart: unless-stopped
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    # start only once MariaDB is healthy, so the install doesn't fail
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    container_name: nginx
    restart: unless-stopped
    # the only port open to the outside. "outside:inside"
    ports:
      - "443:443"
    # same files as wordpress, read-only (ro): nginx only needs to read them
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    depends_on:
      - wordpress

# Named volumes. The "local" driver with these options stores the data in
# /home/kmummadi/data (required by the subject). They are still docker named
# volumes: you see them with `docker volume ls`. The folders must exist first,
# that's why the Makefile does mkdir -p.
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kmummadi/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kmummadi/data/wordpress

# Our own bridge network: containers find each other by service name
# (that's why wordpress can reach the database at the name "mariadb")
networks:
  inception:
    driver: bridge

# Each file shows up inside the container as /run/secrets/<name>
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
