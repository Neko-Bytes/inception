server {
    # Accept HTTPS connections only.
    listen 443 ssl;
    server_name kmummadi.42.fr;

    # Location of the WordPress files.
    root /var/www/html;
    index index.php;

    # HTTPS certificate and permitted TLS versions.
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Serve website files or pass requests to WordPress.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Send PHP requests to the WordPress container.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }
}
