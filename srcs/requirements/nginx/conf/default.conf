# nginx config: the only way into the project, HTTPS on port 443 only
#
# What it does:
#   1. listens on 443 with TLS (there is no port 80, so plain http doesn't work)
#   2. allows only TLSv1.2 and TLSv1.3 (required by the subject)
#   3. serves the WordPress files from the shared wordpress volume
#   4. sends every .php request to php-fpm in the wordpress container
#
# Sources:
#   HTTPS and ssl_protocols: https://nginx.org/en/docs/http/configuring_https_servers.html
#   fastcgi_pass:            https://nginx.org/en/docs/http/ngx_http_fastcgi_module.html

server {
    # if you change 443, also change the ports line in docker-compose.yml
    listen 443 ssl;
    server_name kmummadi.42.fr;

    # self-signed certificate made in the Dockerfile
    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # the wordpress volume is mounted here (read-only for nginx)
    root /var/www/html;
    index index.php;

    # normal pages: send the file if it exists, otherwise let WordPress handle the URL
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # .php files: nginx can't run PHP, so it passes them to php-fpm
    location ~ \.php$ {
        # don't pass files that don't exist to php-fpm
        try_files $uri =404;

        include fastcgi_params;
        # "wordpress" = service name, 9000 = php-fpm port (set in wordpress/Dockerfile)
        fastcgi_pass wordpress:9000;
        # tells php-fpm which file to run
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
